<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Simulador Resonador</title>

  <!-- IMPORTMAP PARA THREE -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body { font-family: Arial; margin: 16px; }
    .card { border:1px solid #ccc; padding:12px; border-radius:10px; margin-bottom:12px; }
    button { padding:8px 12px; border-radius:8px; cursor:pointer; }
    canvas { border:1px solid #ccc; }
    .row { display:flex; gap:10px; align-items:center; margin-bottom:10px; }
  </style>
</head>

<body>
<h1>Simulador Resonador</h1>

<div class="card">
  <button id="btnSim">Simular</button>
  <button id="btnTimeline" disabled>Render Timeline</button>
  <button id="btn3D" disabled>Inicializar 3D</button>
  <button id="btnPlay3D" disabled>Play</button>

  Velocidad:
  <input id="speed3D" type="number" value="10" min="1" max="100">
  <span id="clock3D">t=0</span>
</div>

<div class="card">
  <h3>Timeline 2D</h3>
  <canvas id="timeline" width="1200" height="400"></canvas>
</div>

<div class="card">
  <h3>Vista 3D</h3>
  <div style="height:500px">
    <canvas id="view3d" style="width:100%;height:100%"></canvas>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
