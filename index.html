<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Simulador Resonador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body { font-family: system-ui, Arial; margin: 16px; }
    h1 { margin: 0 0 10px; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin: 10px 0; }

    label { font-size: 12px; color: #444; }
    input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 8px; width: 120px; }

    button { padding: 8px 12px; border: 1px solid #333; background: #111; color: #fff;
             border-radius: 10px; cursor: pointer; }
    button.secondary { background: #fff; color: #111; }

    .muted { color: #666; font-size: 12px; }

    .scroll { max-height: 420px; overflow: auto; border-radius: 10px; border: 1px solid #ddd; }

    canvas { display: block; }

  </style>
</head>

<body>

<h1>Simulador Resonador</h1>
<div class="muted">Simular → Timeline 2D → Vista 3D con waypoints</div>

<div class="card">
  <div class="row">
    <button id="btnSim">Simular</button>
    <button id="btnTimeline" class="secondary" disabled>Render timeline</button>
  </div>
  <div id="status" class="muted"></div>
</div>

<div class="card">
  <h3>Timeline 2D</h3>

  <div class="row">
    <label>Escala(px/min)
      <input id="scale" type="number" value="2" step="0.5">
    </label>

    <label>Filas
      <input id="maxRows" type="number" value="60">
    </label>
  </div>

  <div class="scroll" style="padding:10px;">
    <canvas id="timeline" width="1400" height="600"
      style="border:1px solid #ddd;border-radius:10px;"></canvas>
  </div>
</div>

<div class="card">
  <h3>Vista 3D</h3>
  <div class="muted">Click para crear waypoints y conectar rutas</div>

  <div class="row">
    <button id="btn3D" class="secondary" disabled>Inicializar 3D</button>
    <button id="btnPlay3D" class="secondary" disabled>Play</button>

    <label>Velocidad
      <input id="speed3D" type="number" value="10">
    </label>

    <button id="btnWpMode" class="secondary" disabled>Modo Waypoints</button>
    <button id="btnEdgeMode" class="secondary" disabled>Modo Conectar</button>
    <button id="btnExportLayout" class="secondary" disabled>Export Layout</button>

    <div id="wpHint" class="muted"></div>
    <div id="clock3D" class="muted">t=0.0 min</div>
  </div>

  <div style="height:520px;border:1px solid #ddd;border-radius:10px;overflow:hidden;">
    <canvas id="view3d" style="width:100%;height:100%;"></canvas>
  </div>
</div>

<script type="module" src="./src/main.js?v=10"></script>

</body>
</html>
